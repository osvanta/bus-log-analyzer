# Keeps the GitHub Actions in .github/workflows/ current. They are pinned to a
# commit, so without this they would never move: Dependabot opens a PR that
# updates the commit and the version comment beside it together.
#
# Python packages need no entry here: security updates are on for the
# repository, and an ordinary upgrade is a deliberate step, because
# THIRD_PARTY_NOTICES.md and licenses/ must follow it (requirements-release.in).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
