name: Guide

# Builds the user guide (mkdocs.yml, guide/) and publishes it to GitHub Pages.
# A pull request that changes the guide only builds it, so a broken link or a
# missing image fails there, before it reaches main. Only a push to main
# publishes, and the github-pages environment accepts deployments from main
# alone.
on:
  push:
    branches:
      - main
    paths:
      - 'guide/**'
      - 'mkdocs.yml'
      - '.github/workflows/guide.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'guide/**'
      - 'mkdocs.yml'
      - '.github/workflows/guide.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the guide
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the guide's tools
        run: python -m pip install -r guide/requirements.txt

      # --strict: a broken link or a missing image fails the build.
      - name: Build
        run: mkdocs build --strict

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Only this job may publish, and it can do nothing else.
    permissions:
      pages: write
      id-token: write
      actions: read     # deploy-pages fetches the uploaded site by its id
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
