name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Read-only by default. Only the release job, which builds nothing, may write.
permissions:
  contents: read

# Actions are pinned to a commit, not a tag: a tag can be moved to other code,
# a commit cannot. The comment names the release; Dependabot updates both
# (.github/dependabot.yml).

jobs:
  test:
    name: Tests (Windows)
    runs-on: windows-latest
    env:
      # Turn fixture/Qt skips into failures — a green run must mean the
      # loading/decoding and GUI tests actually executed.
      OSVANTA_STRICT_FIXTURES: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      # The versions the release is built with, checked against their hashes;
      # then the test tools, which are not shipped.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-release.txt
          pip install -r requirements-dev.txt

      # -rs lists the reason for every skip in the summary, so a suite that
      # quietly stops covering something is visible in the log rather than
      # hidden behind a green check.
      - name: Run test suite
        run: python -m pytest tests/ -q --tb=short -rs

  build:
    name: Build on Windows
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      # Runs before the dependency install and PyInstaller build below so a
      # version mismatch fails in seconds, not after Windows build minutes
      # are spent. Only checked against the tag on an actual release push —
      # a workflow_dispatch run from a branch has no tag to compare against.
      - name: Check version consistency
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            python tools/check_version_consistency.py "${{ github.ref_name }}"
          } else {
            python tools/check_version_consistency.py
          }

      # Exactly the versions in requirements-release.txt, PyInstaller
      # included, each checked against its hash: a tag always builds with the
      # same libraries, and THIRD_PARTY_NOTICES.md names what it holds.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-release.txt

      - name: Build portable EXE
        run: pyinstaller BusLogAnalyzer.spec

      - name: Verify build output
        shell: pwsh
        run: |
          if (!(Test-Path "dist\BusLogAnalyzer\BusLogAnalyzer.exe")) {
            Write-Error "Build failed: BusLogAnalyzer.exe not found"
            exit 1
          }
          Write-Host "Build succeeded."

      - name: Zip dist folder
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "BusLogAnalyzer_${tag}_Windows.zip"
          Compress-Archive -Path "dist\BusLogAnalyzer\*" -DestinationPath $zipName
          Write-Host "Created: $zipName"

      # A software bill of materials (CycloneDX): every package installed for
      # the build, with its exact version. A superset of what the application
      # holds, since PyInstaller and pip are listed too. Customers check it
      # against vulnerability databases. The generator runs from its own
      # environment so that it does not list itself.
      - name: Software bill of materials
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $python = (Get-Command python).Source
          python -m venv "$env:RUNNER_TEMP\sbom"
          & "$env:RUNNER_TEMP\sbom\Scripts\python.exe" -m pip install --quiet cyclonedx-bom==7.5.0
          $sbom = "BusLogAnalyzer_${tag}_sbom.cdx.json"
          & "$env:RUNNER_TEMP\sbom\Scripts\cyclonedx-py.exe" environment --mc-type application --output-reproducible --of JSON -o $sbom $python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Name the application itself, which has no PEP 621 metadata.
          $bom = Get-Content $sbom -Raw | ConvertFrom-Json
          $component = [pscustomobject]@{ type = 'application'; name = 'Osvanta Bus Log Analyzer'; version = $tag }
          $bom.metadata | Add-Member -NotePropertyName component -NotePropertyValue $component -Force
          [IO.File]::WriteAllText("$PWD\$sbom", ($bom | ConvertTo-Json -Depth 100))
          Write-Host "Created: $sbom"

      # sha256sum format ("<hash>  <file>", LF line ends), so `sha256sum -c`
      # checks it; on Windows, Get-FileHash prints the same hash.
      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem "BusLogAnalyzer_${{ github.ref_name }}_*" | Where-Object Name -notlike '*_SHA256SUMS.txt'
          $lines = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name }
          [IO.File]::WriteAllText("$PWD\BusLogAnalyzer_${{ github.ref_name }}_SHA256SUMS.txt", ($lines -join "`n") + "`n")
          $lines

      - name: Keep the release files for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-files
          path: |
            BusLogAnalyzer_*_Windows.zip
            BusLogAnalyzer_*_sbom.cdx.json
            BusLogAnalyzer_*_SHA256SUMS.txt
          if-no-files-found: error

  # workflow_dispatch from a branch has no tag — build and zip still run
  # as a smoke test, but nothing gets published.
  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    # The one job that can write to the repository: it publishes the files the
    # build job made, and runs no code from the repository.
    permissions:
      contents: write
    steps:
      - name: Fetch the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: |
            BusLogAnalyzer_*_Windows.zip
            BusLogAnalyzer_*_sbom.cdx.json
            BusLogAnalyzer_*_SHA256SUMS.txt
          generate_release_notes: false
          body: |
            ## Osvanta Bus Log Analyzer ${{ github.ref_name }}

            ### Installation
            1. Download `BusLogAnalyzer_${{ github.ref_name }}_Windows.zip`
            2. Unzip anywhere
            3. Run `BusLogAnalyzer.exe` — no Python installation required

            ### Check the download
            `BusLogAnalyzer_${{ github.ref_name }}_SHA256SUMS.txt` holds the SHA-256 of each file. In PowerShell:
            `Get-FileHash BusLogAnalyzer_${{ github.ref_name }}_Windows.zip` must print the same hash.

            `BusLogAnalyzer_${{ github.ref_name }}_sbom.cdx.json` is the software bill of materials (CycloneDX): every package the release was built with, and its version.

            ### Supported formats
            - Vector BLF (`.blf`) — requires DBC
            - Vector ASC (`.asc`) — requires DBC
            - ASAM MF4 (`.mf4`) — no DBC needed
            - ASAM MDF (`.mdf`) — no DBC needed
            - CSV signal files (`.csv`) — no DBC needed

            > ⚠️ This release is unsigned. Windows may show a SmartScreen warning — click **More info → Run anyway**.

            ### Requirements
            - Windows 10 or later (64-bit)

            ### Security and data handling
            See [Security and data handling](https://osvanta.github.io/bus-log-analyzer/security-and-data/) in the user guide.

            ### Changes
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
