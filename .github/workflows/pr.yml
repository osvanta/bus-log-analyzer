name: PR Checks

# Runs on every pull request into main. Kept separate from build.yml, which
# publishes releases and therefore needs `contents: write` — this workflow
# only ever reads.
on:
  pull_request:
    branches:
      - main
    # `labeled`/`unlabeled` are required for the `approved-pipeline-change`
    # override in the guard job below to work at all. Under the default types
    # (opened/synchronize/reopened) adding the label fires no event, and
    # re-running the failed job replays the original payload — which has no
    # label — so the override documented in docs/PR_Policy.md would silently
    # never take effect. Removing the label re-runs the guard and re-blocks.
    # Cost: any label change re-runs the Windows jobs too (~4 min). Filtering
    # by label name would need a job-level `if:`, which would leave the
    # required checks skipped rather than passed — see the guard job's note.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast fail: seconds on Linux, before spending Windows minutes ─────────
  guard:
    name: Protected paths
    runs-on: ubuntu-latest
    # NOTE: deliberately no job-level `if:`. This job is a required status
    # check, so it must always run and report a conclusion. The override label
    # is handled inside the step below — a skipped job would leave the required
    # check in an ambiguous state instead of a clean pass.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0        # need both sides of the diff

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Check protected paths
        if: github.event_name == 'pull_request'
        env:
          # The owner applies this label to authorise a pipeline change.
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'approved-pipeline-change') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$APPROVED" = "true" ]; then
            echo "::notice::'approved-pipeline-change' label present — protected-path check waived by the project owner."
            exit 0
          fi
          python tools/check_protected_paths.py "$BASE_SHA" "$HEAD_SHA"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      # Every package a release is built with, against the Python Packaging
      # Advisory and OSV databases. --disable-pip reads the pinned versions
      # without installing them. Report-only for now: a vulnerability
      # published upstream must not block an unrelated PR. Flip
      # continue-on-error to false to make it a required gate.
      - name: Audit requirements-release.txt
        continue-on-error: true
        run: pip-audit -r requirements-release.txt --require-hashes --disable-pip --progress-spinner off

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      # Report-only for now — flip continue-on-error to false once the
      # codebase is clean enough for lint failures to block merges.
      - name: Run ruff
        continue-on-error: true
        run: ruff check .

  test:
    name: Tests (Windows)
    runs-on: windows-latest
    env:
      # Turn fixture/Qt skips into failures — a green run must mean the
      # loading/decoding and GUI tests actually executed.
      OSVANTA_STRICT_FIXTURES: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-release.txt
          pip install -r requirements-dev.txt

      # -rs lists the reason for every skip in the summary, so a suite that
      # quietly stops covering something is visible in the log rather than
      # hidden behind a green check.
      - name: Run test suite
        run: python -m pytest tests/ -q --tb=short -rs

  build:
    name: Portable build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      # The versions a release is built with, each checked against its hash.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-release.txt

      - name: Build portable EXE
        run: pyinstaller BusLogAnalyzer.spec

      - name: Verify build output
        shell: pwsh
        run: |
          if (!(Test-Path "dist\BusLogAnalyzer\BusLogAnalyzer.exe")) {
            Write-Error "Build failed: BusLogAnalyzer.exe not found"
            exit 1
          }
          Write-Host "Build succeeded."
